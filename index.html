<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerobots - Guia de Procesos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <img src="assets/logo-sin.png" alt="Aerobots" class="header-logo">
        <h1 class="main-title">Guia de Procesos - Sistema de Ensamblaje</h1>
        <div class="user-status" id="user-status"></div>
    </header>

    <main class="dashboard">
        <div class="grid-container" id="categorias-container">
            <!-- Las categorias se cargan dinamicamente desde Supabase -->
        </div>
    </main>

    <footer class="footer">
        <p class="version">Aerobots System v1.0</p>
    </footer>

    <div class="modal-overlay" id="modal-login">
        <div class="modal">
            <button class="modal-close" id="modal-close">X</button>
            <h2>Iniciar Sesion</h2>
            <p class="modal-subtitle">Acceso exclusivo para editores</p>
            <form id="form-login">
                <input type="email" id="login-email" placeholder="Correo electronico" required autocomplete="email">
                <input type="password" id="login-password" placeholder="Contrasena" required autocomplete="current-password">
                <button type="submit" id="btn-login">Entrar</button>
            </form>
            <p class="modal-message" id="modal-message"></p>
        </div>
    </div>

    <div class="modal-overlay" id="modal-edit-categoria">
        <div class="modal">
            <button class="modal-close" id="modal-cat-close">X</button>
            <h2>Editar Categoria</h2>
            <p class="modal-subtitle">Modifica los datos de la categoria</p>
            <form id="form-edit-categoria">
                <label class="form-label">Nombre</label>
                <input type="text" id="cat-nombre" placeholder="Ej: Armado" required>

                <label class="form-label">Descripcion</label>
                <input type="text" id="cat-descripcion" placeholder="Ej: Estructura y armado de modulos">

                <label class="form-label">Estado</label>
                <select id="cat-estado">
                    <option value="authorized">Aprobado</option>
                    <option value="squeezed">Pendiente</option>
                </select>

                <button type="submit" id="btn-save-categoria">Guardar cambios</button>
            </form>
            <p class="modal-message" id="modal-cat-message"></p>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/script.js"></script>
    <script src="../js/header-scroll.js"></script>
</body>
</html>
